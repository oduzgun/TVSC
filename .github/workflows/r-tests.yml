name: R tests

on:
  push:
  pull_request:

jobs:
  base-r-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Print R version
        run: Rscript --version

      - name: Run base-R fixtures
        run: Rscript tests/test-panel.dataprep.R
