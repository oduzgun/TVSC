name: R tests

on:
  push:
  pull_request:

jobs:
  base-r-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Print R version
        run: Rscript --version

      - name: Run version-2 tvsc.dataprep fixtures
        run: Rscript --vanilla tests/test-tvsc.dataprep.R

      - name: Run version-2 tvsc.split fixtures
        run: Rscript --vanilla tests/test-tvsc.split.R

      - name: Run tvsc.vmetrics fixtures
        run: Rscript --vanilla tests/test-tvsc.vmetrics.R

      - name: Run documented tvsc.dataprep example
        run: |
          Rscript --vanilla -e '
          source("R/tvsc.dataprep.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB"),
            year = 2000:2004,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          panel$income <- 1000 + seq_len(nrow(panel))
          prepared <- tvsc.dataprep(
            data = panel, unit = "state", time = "year", outcome = "sales",
            treated = "Target", donors = c("DonorB", "DonorA"),
            intervention_time = 2003, pre_period = 2000:2002,
            predictors = c("sales", "income")
          )
          stopifnot(
            identical(prepared$schema_version, 2L),
            identical(prepared$blocks$schema_version, 2L),
            identical(prepared$blocks$dimensions, list(predictors = 2L, donors = 2L, periods = 3L)),
            identical(names(prepared$blocks$X0), as.character(2000:2002))
          )
          cat("Documented tvsc.dataprep example passed.\n")
          '

      - name: Run documented tvsc.split example
        run: |
          Rscript --vanilla -e '
          source("R/tvsc.dataprep.R")
          source("R/tvsc.split.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB"),
            year = 2000:2009,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          prepared <- tvsc.dataprep(
            panel, "state", "year", "sales", "Target", c("DonorB", "DonorA"),
            2008, 2000:2007, "sales"
          )
          splits <- tvsc.split(prepared, initial = 4, horizon = 2, step = 1)
          stopifnot(
            identical(splits$schema_version, 1L),
            identical(splits$folds[[1]]$train_period, 2000:2003),
            identical(splits$folds[[1]]$validation_period, 2004:2005),
            identical(splits$diagnostics$fold_count, 3L)
          )
          cat("Documented tvsc.split example passed.\n")
          '

      - name: Run documented tvsc.vmetrics example
        run: |
          Rscript --vanilla -e '
          source("R/tvsc.dataprep.R")
          source("R/tvsc.vmetrics.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB", "DonorC"),
            year = 2000:2005,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          panel$income <- 100 + seq_len(nrow(panel))
          prepared <- tvsc.dataprep(
            panel, "state", "year", "sales", "Target",
            c("DonorC", "DonorB", "DonorA"), 2005, 2000:2004,
            c("sales", "income")
          )
          metrics <- tvsc.vmetrics(prepared, cutoff = 2003, predictor_weights = "uniform", scaling = "none")
          supplied <- tvsc.vmetrics(prepared, cutoff = 2003, predictor_weights = c(sales = 0.75, income = 0.25), scaling = "none")
          stopifnot(
            inherits(metrics, "tvsc_vmetrics"),
            identical(metrics$schema_version, 1L),
            identical(metrics$blocks$schema_version, 2L),
            identical(dim(metrics$weights), c(2L, 4L)),
            all(colSums(supplied$weights) == 1)
          )
          cat("Documented tvsc.vmetrics example passed.\n")
          '

      - name: Record session info
        run: |
          mkdir -p validation
          Rscript --vanilla -e 'writeLines(capture.output(sessionInfo()), "validation/session-info.txt")'

      - name: Upload validation session info
        uses: actions/upload-artifact@v4
        with:
          name: r-validation-session-info
          path: validation/session-info.txt
