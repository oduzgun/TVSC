name: R tests

on:
  push:
  pull_request:

jobs:
  base-r-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Print R version
        run: Rscript --version

      - name: Run panel.dataprep fixtures
        run: Rscript tests/test-panel.dataprep.R

      - name: Run panel.split fixtures
        run: Rscript tests/test-panel.split.R

      - name: Run panel.blocks fixtures
        run: Rscript tests/test-panel.blocks.R

      - name: Run panel.scale fixtures
        run: Rscript --vanilla tests/test-panel.scale.R

      - name: Run documented panel.split example
        run: |
          Rscript -e '
          source("R/panel.dataprep.R")
          source("R/panel.split.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB"),
            year = 2000:2009,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          prepared <- panel.dataprep(
            panel, "state", "year", "sales", "Target", c("DonorB", "DonorA"),
            2008, 2000:2007, "sales"
          )
          splits <- panel.split(prepared, initial = 4, horizon = 2, step = 1)
          stopifnot(
            identical(splits$folds[[1]]$train_period, 2000:2003),
            identical(splits$folds[[1]]$validation_period, 2004:2005),
            identical(splits$diagnostics$fold_count, 3L)
          )
          cat("Documented panel.split example passed.\n")
          '

      - name: Run documented panel.blocks example
        run: |
          Rscript -e '
          source("R/panel.dataprep.R")
          source("R/panel.blocks.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB"),
            year = 2000:2007,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          panel$income <- 1000 + seq_len(nrow(panel))
          prepared <- panel.dataprep(
            panel, "state", "year", "sales", "Target", c("DonorB", "DonorA"),
            2006, 2000:2005, c("income", "sales")
          )
          blocks <- panel.blocks(prepared, cutoff = 2003)
          stopifnot(
            identical(blocks$periods, 2000:2003),
            identical(blocks$dimensions, list(predictors = 2L, donors = 2L, periods = 4L)),
            identical(blocks$X1[["2000"]], c(income = 1001, sales = 10)),
            identical(dim(blocks$X0[["2000"]]), c(2L, 2L))
          )
          cat("Documented panel.blocks example passed.\n")
          '

      - name: Run documented panel.scale example
        run: |
          Rscript --vanilla -e '
          source("R/panel.dataprep.R")
          source("R/panel.blocks.R")
          source("R/panel.scale.R")
          panel <- expand.grid(
            state = c("Target", "DonorA", "DonorB"),
            year = 2000:2005,
            stringsAsFactors = FALSE
          )
          panel$sales <- seq_len(nrow(panel)) * 10
          prepared <- panel.dataprep(
            panel, "state", "year", "sales", "Target",
            c("DonorB", "DonorA"), 2005, 2000:2004, "sales"
          )
          blocks <- panel.blocks(prepared, 2003)
          scaled <- panel.scale(blocks)
          unchanged <- panel.scale(blocks, "none")
          stopifnot(
            inherits(scaled, "tvsc_scaled_blocks"),
            identical(unchanged$X0, blocks$X0),
            identical(scaled$Y0, blocks$Y0),
            identical(dim(scaled$recipe$scaling$divisors), c(1L, 4L))
          )
          cat("Documented panel.scale example passed.\n")
          '

      - name: Record session info
        run: |
          mkdir -p validation
          Rscript -e 'writeLines(capture.output(sessionInfo()), "validation/session-info.txt")'

      - name: Upload validation session info
        uses: actions/upload-artifact@v4
        with:
          name: r-validation-session-info
          path: validation/session-info.txt
